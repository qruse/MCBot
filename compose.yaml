services:
  backend:
    build:
      context: ./backend
    environment:
      ROOT_PATH: /api
      PAPER_DB_PATH: /data/sessions.sqlite3
      PAPER_EXCHANGE_PATH: /exchange
      PAPER_TRUST_LOCAL_PROXY: "true"
    volumes:
      - paper_data:/data
      - ./runtime/agent_exchange:/exchange
    env_file:
      - path: ./backend/.env
        required: false
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  paper_data:
